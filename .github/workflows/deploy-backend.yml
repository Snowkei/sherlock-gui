name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '!.github/workflows/deploy-backend.yml'
      - '.github/workflows/deploy-backend.yml'

# Only keep the latest run; cancel in-progress ones
concurrency:
  group: backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sherlock-gui-backend:latest
            ghcr.io/${{ github.repository_owner }}/sherlock-gui-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Railway auto-deploys from the Dockerfile in the repo root or a subdirectory.
      # We notify Railway via webhook after the image is built.
      - name: Notify Railway
        run: |
          curl -s -X POST "${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"service":"${{ vars.RAILWAY_SERVICE_ID }}","environment":"${{ vars.RAILWAY_ENVIRONMENT_ID }}","image":"ghcr.io/${{ github.repository_owner }}/sherlock-gui-backend:${{ github.sha }}"}'
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ghcr.io/${{ github.repository_owner }}/sherlock-gui-backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend API will auto-update on Railway within ~2-3 minutes" >> $GITHUB_STEP_SUMMARY
