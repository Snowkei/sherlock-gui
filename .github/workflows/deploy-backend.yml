name: Build & Deploy Backend to Cloudflare Container

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '!backend/static/**'
      - 'Dockerfile'
      - 'fly.toml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Cloudflare Container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to Cloudflare Container Registry ──
      - name: Log in to Cloudflare
        run: |
          echo "${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}" | \
          docker login cr.cloudflare.com -u cf-token --password-stdin

      # ── Build & Push directly to Cloudflare ──────
      - name: Build and push to Cloudflare
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            cr.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/sherlock-gui-backend:latest
            cr.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/sherlock-gui-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        run: |
          echo "## ✅ Backend Deployed to Cloudflare Container" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`cr.cloudflare.com/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/sherlock-gui-backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Go to [Cloudflare Dashboard → Container Hosting](https://dash.cloudflare.com/?to=/:account/container) to verify the deployment." >> $GITHUB_STEP_SUMMARY
