name: Build & Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '!backend/static/**'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Railway Deploy
        run: |
          echo "Railway auto-deploys from GitHub when you connect the repo."
          echo "GitHub Actions → Railway integration is the recommended approach."
          echo ""
          echo "To set up:"
          echo "1. Go to https://railway.app"
          echo "2. New Project → Deploy from GitHub"
          echo "3. Select 'snowkei/sherlock-gui'"
          echo "4. Railway will auto-detect backend/Dockerfile"
          echo "5. Copy the Railway URL (e.g. https://sherlock-gui-backend.up.railway.app)"
          echo "6. Add it as VITE_API_BASE_URL in GitHub Secrets"
