name: Build & Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL (e.g. https://sherlock-gui-backend.railway.app)'
        required: false
        type: string

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Determine backend URL
        id: backend
        run: |
          URL="${{ github.events.inputs.backend_url || secrets.VITE_API_BASE_URL || '' }}"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Write .env
        run: |
          if [ -n "${{ steps.backend.outputs.url }}" ]; then
            echo "VITE_API_BASE=${{ steps.backend.outputs.url }}" > frontend/.env
            echo "VITE_API_BASE set to: ${{ steps.backend.outputs.url }}"
          else
            echo "No backend URL — frontend will call its own origin"
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sherlock-gui
          directory: frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

      - name: Summary
        run: |
          echo "## ✅ Frontend Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.backend.outputs.url }}" ]; then
            echo "Backend API: \`${{ steps.backend.outputs.url }}\`" >> $GITHUB_STEP_SUMMARY
          fi
