services:
  sherlock-gui:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: sherlock-gui
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Tor proxy for anonymous mode
  tor:
    image: dperson/tor-proxy:latest
    container_name: sherlock-tor
    ports:
      - "9050:9050"
      - "9051:9051"
    restart: unless-stopped
