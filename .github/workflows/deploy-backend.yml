name: Build & Deploy Backend to Cloudflare Container Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '!backend/static/**'
      - 'Dockerfile'
      - 'fly.toml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Push to GHCR ──────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sherlock-gui-backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ── Deploy to Cloudflare Container ────────
      - name: Deploy to Cloudflare Container
        run: |
          set -e

          IMAGE="ghcr.io/${{ github.repository_owner }}/sherlock-gui-backend:latest"
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN="${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}"

          echo "📦 Image: $IMAGE"
          echo "🌥️  Account: $ACCOUNT_ID"

          # Login to Cloudflare Container Registry
          echo "$TOKEN" | docker login cr.cloudflare.com -u cf-token --password-stdin

          # Tag for Cloudflare Registry
          CF_IMAGE="cr.cloudflare.com/$ACCOUNT_ID/sherlock-gui-backend:latest"
          docker tag "$IMAGE" "$CF_IMAGE"

          # Push to Cloudflare Registry
          echo "⬆️  Pushing to Cloudflare Container Registry..."
          docker push "$CF_IMAGE"

          echo ""
          echo "✅ Image pushed to: $CF_IMAGE"
          echo ""
          echo "⚠️  Next: Go to https://dash.cloudflare.com → Container Hosting → Deploy this image"
